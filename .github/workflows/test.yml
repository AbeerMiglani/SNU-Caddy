name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the older run. On main every commit gets
# its own full run, so two quick merges are both tested.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Security rules (Database emulator) and unit tests.
  test:
    runs-on: ubuntu-latest
    # Stops a stuck emulator from using up Actions minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The Firebase Database emulator needs Java.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The emulator download depends on the firebase-tools version in the
      # lockfile, so it is only downloaded again when that changes.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - run: npm ci

      - run: npm test

  # The three pages in Chromium, served by the Hosting emulator with the real
  # firebase.json headers (CSP), against the Auth and Database emulators.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/cache@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - run: npm ci

      # Chromium for the Playwright version in the lockfile, with its system libraries.
      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
